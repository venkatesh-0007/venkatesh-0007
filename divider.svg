<svg width="100%" height="4" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#333" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#sweep)" x="-100%">
    <animate attributeName="x" from="-100%" to="100%" dur="2.5s" repeatCount="indefinite" />
  </rect>
</svg>
